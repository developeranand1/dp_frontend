<!-- High-Fashion Toast Notifications -->
<app-toast></app-toast>

<!-- Luxury Navigation Bar -->
<app-navbar></app-navbar>

<!-- Routed Page Stage (Home, Track Order, Admin) -->
<main class="main-content">
  <router-outlet></router-outlet>
</main>

<!-- Quick View Modal -->
<app-quick-view-modal></app-quick-view-modal>

<!-- Slide-Out Cart Bag Drawer with Razorpay Checkout -->
<app-cart-drawer></app-cart-drawer>

<!-- Slide-Out Wishlist Drawer -->
<app-wishlist-drawer></app-wishlist-drawer>

<!-- Luxury Editorial Footer & VIP Club -->
<app-footer></app-footer>

<!-- Floating Desktop & Mobile Quick-Action Buttons (Bottom Right) -->
<div class="floating-quick-actions d-none d-sm-flex flex-column gap-2 position-fixed bottom-0 end-0 m-4 z-3">
  <!-- WhatsApp Floating Bubble -->
  <a 
    [href]="fashionService.getWhatsAppLink()" 
    target="_blank" 
    rel="noopener noreferrer" 
    class="floating-contact-btn floating-wa-btn shadow-lg"
    title="WhatsApp only: +91 85955 72121">
    <i class="bi bi-whatsapp"></i>
    <span class="floating-tooltip">WhatsApp Order (+91 85955 72121)</span>
  </a>

  <!-- Call Floating Bubble -->
  <a 
    [href]="fashionService.storeInfo.phoneTel" 
    class="floating-contact-btn floating-call-btn shadow-lg"
    title="Call Daposh Fashion (+91 85955 72121)">
    <i class="bi bi-telephone-fill"></i>
    <span class="floating-tooltip">Call +91 85955 72121</span>
  </a>

  <!-- GPS Maps Floating Bubble -->
  <a 
    [href]="fashionService.storeInfo.gpsLocation" 
    target="_blank" 
    rel="noopener noreferrer" 
    class="floating-contact-btn floating-map-btn shadow-lg"
    title="Store Location: D85 shop no 6, Malviya nagar, New delhi 110017">
    <i class="bi bi-geo-alt-fill"></i>
    <span class="floating-tooltip">Store GPS Location 📍</span>
  </a>
</div>

<!-- Mobile Floating App Bottom Navigation Bar -->
<nav class="mobile-bottom-bar d-lg-none d-flex align-items-center justify-content-around py-1 border-top bg-white position-fixed bottom-0 start-0 w-100 z-3 shadow-lg">
  <!-- Direct Call -->
  <a [href]="fashionService.storeInfo.phoneTel" class="mobile-bar-btn d-flex flex-column align-items-center text-dark text-decoration-none">
    <i class="bi bi-telephone-fill text-dark"></i>
    <span class="bar-btn-text">CALL</span>
  </a>

  <!-- Direct WhatsApp Only -->
  <a [href]="fashionService.getWhatsAppLink()" target="_blank" rel="noopener noreferrer" class="mobile-bar-btn d-flex flex-column align-items-center text-decoration-none text-success">
    <i class="bi bi-whatsapp fs-5"></i>
    <span class="bar-btn-text text-success fw-bold">WHATSAPP</span>
  </a>

  <!-- Track Order -->
  <a routerLink="/track-order" class="mobile-bar-btn d-flex flex-column align-items-center text-dark text-decoration-none">
    <i class="bi bi-truck"></i>
    <span class="bar-btn-text">TRACK</span>
  </a>

  <!-- Admin Panel -->
  <a routerLink="/admin" class="mobile-bar-btn d-flex flex-column align-items-center text-dark text-decoration-none">
    <i class="bi bi-shield-lock"></i>
    <span class="bar-btn-text">ADMIN</span>
  </a>

  <!-- Cart Bag -->
  <button class="mobile-bar-btn d-flex flex-column align-items-center border-0 bg-transparent text-dark position-relative" (click)="fashionService.toggleCart(true)">
    <i class="bi bi-bag"></i>
    <span class="bar-btn-text">BAG</span>
    @if (fashionService.cartCount() > 0) {
      <span class="mobile-count-pill">{{ fashionService.cartCount() }}</span>
    }
  </button>
</nav>
